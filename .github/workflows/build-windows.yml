name: Build Windows app
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - name: Package app
        run: npx electron-packager . InkNotes --platform=win32 --arch=x64 --out=../build --overwrite --prune=true --ignore="(\.bat$|package-lock\.json)"
      - name: Zip
        shell: pwsh
        run: |
          Set-Content -Path ../build/InkNotes-win32-x64/README.txt -Value "Unzip this folder anywhere, then double-click InkNotes.exe. Nothing to install."
          Compress-Archive -Path ../build/InkNotes-win32-x64 -DestinationPath ../InkNotes-Windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: InkNotes-Windows
          path: InkNotes-Windows.zip
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: InkNotes-Windows.zip
