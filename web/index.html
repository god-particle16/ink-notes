<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>InkNotes</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:;">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#26282d">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="stylesheet" href="style.css">
</head>
<body data-view="home">
<div id="home">
  <header class="hbar">
    <div class="brand"><img src="icon-192.png" alt="" width="34" height="34"><h1>InkNotes</h1></div>
    <div class="hsearch">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      <input id="search" type="search" placeholder="Search notes" aria-label="Search notes" autocomplete="off" spellcheck="false">
    </div>
    <div class="hact">
      <select id="sort" aria-label="Sort notes">
        <option value="edited">Last edited</option>
        <option value="created">Newest first</option>
        <option value="name">Name A–Z</option>
      </select>
      <button class="tx" id="hImport" title="Add a note from a .inknote backup file">Import</button>
      <button class="tx primary" id="hNew">+ New note</button>
    </div>
  </header>
  <main class="hmain">
    <div class="hhead"><h2>My notes</h2><span id="count"></span></div>
    <div id="grid"></div>
    <p id="msg" hidden></p>
    <p class="foot">Notes save automatically inside this browser. Use <b>⋯ → Export file</b> to keep a backup copy.</p>
  </main>
</div>

<div id="app">
  <header id="top">
    <div class="grp left">
      <button class="tx" id="bHome" title="Back to all notes"><b>‹</b> Notes</button>
      <input id="noteName" class="title" maxlength="80" placeholder="Untitled" spellcheck="false" autocomplete="off" aria-label="Note title">
    </div>
    <div class="grp filebtns">
      <button class="tx" id="bNew" title="New note">New</button>
      <button class="tx" id="bOpen" title="Add a note from a .inknote backup file">Import</button>
      <button class="tx" id="bSave" title="Download a .inknote backup file (notes also save automatically)">Backup</button>
      <button class="tx" id="bPdf" title="Export all pages as PDF">PDF</button>
      <button class="tx" id="bPng" title="Export current page as PNG">PNG</button>
    </div>

    <div class="wrap fileMenu">
      <button class="tx" id="bFile" title="File menu">File ▾</button>
      <div class="pop left" id="filePop">
        <button class="mi" data-act="new">New note…</button>
        <button class="mi" data-act="open">Import note file…</button>
        <button class="mi" data-act="save">Download backup file</button>
        <button class="mi" data-act="pdf">Export as PDF</button>
        <button class="mi" data-act="png">Export page as PNG</button>
      </div>
    </div>

    <div class="grp tools" id="tools">
      <button class="tb" data-tool="pen" title="Pen"><i>✒️</i><span>Pen</span></button>
      <button class="tb" data-tool="pencil" title="Pencil"><i>✏️</i><span>Pencil</span></button>
      <button class="tb" data-tool="marker" title="Marker"><i>🖌️</i><span>Marker</span></button>
      <button class="tb" data-tool="highlighter" title="Highlighter"><i>🖍️</i><span>Highlight</span></button>
      <button class="tb" data-tool="eraser" title="Eraser (erases parts of strokes)"><i><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"><path d="M16 3l5 5-9.5 9.5H6L3 14.5 16 3z"/><path d="M9 21h12"/></svg></i><span>Eraser</span></button>
      <button class="tb" data-tool="strokeEraser" title="Stroke eraser (removes whole strokes)"><i><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="8"/><path d="M9 9l6 6M15 9l-6 6"/></svg></i><span>Stroke</span></button>
      <button class="tb" data-tool="lasso" title="Lasso select"><i><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path stroke-dasharray="3 3" d="M12 4c5 0 9 2.2 9 5s-4 5-9 5-9-2.2-9-5 4-5 9-5z"/><path d="M8 14c-1 2 0 4 2 5"/></svg></i><span>Lasso</span></button>
      <button class="tb" data-tool="pan" title="Hand (move page)"><i>✋</i><span>Hand</span></button>
    </div>

    <div class="grp right">
      <div class="wrap">
        <button class="sw" id="bColor" title="Colour"><b id="swDot"></b></button>
        <div class="pop" id="colorPop">
          <div class="palette" id="palette"></div>
          <div class="row"><label>Custom</label><input type="color" id="colorInput"></div>
          <div class="sub">Recent</div>
          <div class="palette" id="recent"></div>
        </div>
      </div>
      <div class="wrap">
        <button class="tx" id="bPaper" title="Page background">Paper</button>
        <div class="pop" id="bgPop">
          <div class="palette" id="bgPalette"></div>
          <div class="row"><label>Custom colour</label><input type="color" id="bgInput"></div>
          <div class="row"><label>Pattern</label>
            <select id="patSel">
              <option value="none">Blank</option><option value="lines">Ruled</option>
              <option value="grid">Grid</option><option value="dots">Dotted</option>
            </select>
          </div>
          <button class="tx wide" id="bgAll">Apply to all pages</button>
        </div>
      </div>
      <button class="ib" id="bUndo" title="Undo">↶</button>
      <button class="ib" id="bRedo" title="Redo">↷</button>
      <button class="ib" id="bSet" title="Shortcuts &amp; settings">⚙</button>
    </div>
  </header>

  <main id="stage">
    <canvas id="view"></canvas>
    <aside id="side">
      <div class="sl"><span id="opVal">100</span>
        <input type="range" id="opSl" min="5" max="100" value="100" orient="vertical"><label>Opacity</label></div>
      <div class="sl"><span id="sizeVal">4</span>
        <input type="range" id="sizeSl" min="1" max="100" value="4" orient="vertical"><label>Size</label></div>
    </aside>
    <div id="toast"></div>
  </main>

  <footer id="bottom">
    <button class="ib sm" id="pPrev" title="Previous page">‹</button>
    <span id="pageInfo">Page 1 / 1</span>
    <button class="ib sm" id="pNext" title="Next page">›</button>
    <button class="tx sm" id="pAdd">+ Page</button>
    <button class="tx sm" id="pDel">Delete page</button>
    <span class="grow"></span>
    <span id="saveState" role="status"></span>
    <button class="tx sm" id="zFit" title="Fit page">Fit</button>
    <span id="zoomInfo">100%</span>
  </footer>
</div>

<div id="modal" hidden>
  <div class="card">
    <div class="ch"><h2>Settings &amp; shortcuts</h2><button class="ib" id="mClose">✕</button></div>
    <div class="cb">
      <div class="row"><label>Pen pressure</label><input type="range" id="sPress" min="0" max="150" value="100"><span id="sPressV"></span></div>
      <div class="row"><label>Stroke smoothing</label><input type="range" id="sSmooth" min="0" max="80" value="25"><span id="sSmoothV"></span></div>
      <h3>Keyboard shortcuts</h3>
      <p class="hint">Click a shortcut, then press the new key combination. Esc cancels.</p>
      <div id="keyList"></div>
      <button class="tx" id="keyReset">Reset shortcuts</button>
    </div>
  </div>
</div>
<div id="dlg" hidden role="dialog" aria-modal="true" aria-labelledby="dTitle">
  <div class="dcard">
    <h2 id="dTitle"></h2>
    <div class="dbody"></div>
    <div class="dfoot"><button class="tx" id="dCancel">Cancel</button><button class="tx primary" id="dOk">OK</button></div>
  </div>
</div>
<div id="menu" hidden role="menu"></div>
<div id="gtoast" role="status"></div>
<script src="pdf.js"></script>
<script src="web-api.js"></script>
<script src="renderer.js"></script>
<script src="app.js"></script>
</body>
</html>
